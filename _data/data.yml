career-profile:
    title: Career Profile
    summary: |
     I am Arthur Niedźwiecki, a researcher in Robotics and Artificial Intelligence.
     My work focuses on cognitive robotic systems, semantic digital twins, and autonomous action planning. Alongside research, I bring extensive teaching experience, proven success in acquiring third-party funding, and a strong international network within the robotics community.
     My goal: to shape the future of intelligent, collaborative robots at the intersection of science, industry, and society.
      
     
