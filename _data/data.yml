      time: May 2018 - December 2020
      details: |
        Thesis: *Tactile-Based and Cognition-Enabled Manipulation for Real World Assembly Tasks*  
        (Improving the precision of mobile robots in industrial assembly environments)

    - degree: Bachelor of Science in Computer Science
      university: Universität Bremen
      time: October 2013 - April 2018
      details: |
        Thesis: *Plan-Transformation for Autonomous Real World Pick and Place Tasks*  
        (How household robots can autonomously optimize their behavior)

